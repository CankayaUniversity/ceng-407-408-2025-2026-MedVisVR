[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant-workspace6"
version = "0.1.0"
description = "Offline clinical decision-support prototype for brain tumor QA and report generation."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pyspellchecker",
  "rapidfuzz",
]

[project.optional-dependencies]
vision = [
  "numpy",
  "nibabel",
  "SimpleITK",
  "pydicom",
  "nnunetv2",
]
dev = [
  "pytest",
  "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
